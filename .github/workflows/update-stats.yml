name: Update GitHub Stats

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate neofetch SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/generate_stats.py

      - name: Commit updated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/neofetch-dark.svg assets/neofetch-light.svg assets/neofetch-mobile-dark.svg assets/neofetch-mobile-light.svg
          git diff --staged --quiet || \
            git commit -m "chore: refresh neofetch stats [skip ci]"
          git pull --rebase
          git push
